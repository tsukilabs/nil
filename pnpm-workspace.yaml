packages:
  - "app"
  - "docs"
  - "packages/bindings"
  - "packages/ffi"

dedupePeers: true
ignoreWorkspaceRootCheck: true
trustPolicy: no-downgrade

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@tauri-store/*"
  - "@tb-dev/*"
  - "@tsukilabs/*"

allowBuilds:
  esbuild: false
  vue-demi: false

overrides:
  brace-expansion@<=5.0.7: ^5.0.8
