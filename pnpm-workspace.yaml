packages:
  - "app"
  - "docs"
  - "packages/bindings"
  - "packages/ffi"
  - "packages/i18n"

dedupePeers: true
ignoreWorkspaceRootCheck: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@tauri-store/*"
  - "@tb-dev/*"
  - "@tsukilabs/*"
  - hono@4.12.34

allowBuilds:
  esbuild: false
  vue-demi: false

overrides:
  vue: "=3.6.0-rc.2"

  # Security vulnerabilities
  brace-expansion@<5.0.9: ^5.0.9
  hono@<4.12.34: ^4.12.34
